<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slider Library – Vanilla JS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Landscape Gallery</h1>
      <p>A dependency-free image slider built with HTML, CSS and ES6 JavaScript.</p>
    </header>

    <!-- Slider root: the library reads the slides inside .slider__track -->
    <section class="slider" data-slider aria-roledescription="carousel" aria-label="Landscape gallery">
      <div class="slider__viewport">
        <ul class="slider__track">
          <li class="slider__slide"><img src="images/01-himalayan-dawn.jpg" alt="Mountain ridges at dawn under an orange sky"></li>
          <li class="slider__slide"><img src="images/02-lakeside-noon.jpg" alt="Green hills under a clear blue midday sky"></li>
          <li class="slider__slide"><img src="images/03-desert-dusk.jpg" alt="Red desert ridges at dusk"></li>
          <li class="slider__slide"><img src="images/04-forest-mist.jpg" alt="Forested hills in soft morning mist"></li>
          <li class="slider__slide"><img src="images/05-night-ridge.jpg" alt="Dark mountain ridge under a starry night sky"></li>
        </ul>
      </div>

      <button class="slider__arrow slider__arrow--prev" type="button" aria-label="Previous slide">&#10094;</button>
      <button class="slider__arrow slider__arrow--next" type="button" aria-label="Next slide">&#10095;</button>

      <!-- Dots are generated by slider.js to match the number of slides -->
      <div class="slider__dots" role="group" aria-label="Choose slide"></div>
      <p class="slider__status" aria-live="polite"></p>
    </section>
  </main>

  <script src="slider.js"></script>
  <script>
    // Every element marked with data-slider becomes an independent slider.
    document.querySelectorAll('[data-slider]').forEach((el) => new ImageSlider(el, { duration: 600 }));
  </script>
</body>
</html>
